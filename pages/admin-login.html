<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — NOVA</title><link rel="stylesheet" href="../css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#fafaf8}.login{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px}.login h1{font-size:38px;letter-spacing:-2px;margin:8px 0 24px}.login label{display:block;font-size:12px;margin:14px 0}.login input{width:100%;box-sizing:border-box;margin-top:7px;border:1px solid var(--line);border-radius:11px;padding:12px}.login button{width:100%;margin-top:8px;border:0;border-radius:999px;padding:13px;background:#171717;color:#fff;font-weight:700}.error{color:#b33;font-size:12px;margin-top:14px}.back{display:block;margin-top:18px;text-align:center;font-size:12px}.hint{font-size:11px;color:#888;line-height:1.6;background:#f7f7f5;border-radius:10px;padding:10px 12px;margin-top:16px}</style></head><body><main class="login"><a class="logo" href="../index.html">NOVA<span>.</span></a><span class="eyebrow">ADMIN ACCESS</span><h1>Masuk Dashboard</h1><form id="login-form"><label>ID Admin<input id="username" type="text" required minlength="3" autocomplete="username" placeholder="admin"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="••••••••"></label><button>Login</button><div id="error" class="error"></div></form><div class="hint">Login yang terlihat di sini hanya <b>ID + Password</b>. Firebase Authentication tetap memakai email internal di belakang layar agar password ditangani secara aman oleh Firebase.</div><a class="back" href="../index.html">← Kembali ke toko</a></main><script type="module" src="../js/admin-login.js"></script></body></html>
