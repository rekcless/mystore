<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup Admin — NOVA</title><link rel="stylesheet" href="../css/style.css"><style>body{min-height:100vh;display:grid;place-items:center;background:#fafaf8}.login{width:min(430px,calc(100% - 32px));background:#fff;border:1px solid var(--line);border-radius:22px;padding:32px}.login h1{font-size:34px;letter-spacing:-2px;margin:8px 0 24px}.login label{display:block;font-size:12px;margin:14px 0}.login input{width:100%;box-sizing:border-box;margin-top:7px;border:1px solid var(--line);border-radius:11px;padding:12px}.login button{width:100%;margin-top:8px;border:0;border-radius:999px;padding:13px;background:#171717;color:#fff;font-weight:700}.msg{font-size:12px;margin-top:14px;color:#666;line-height:1.5}.warn{font-size:11px;color:#8a5a00;background:#fff7df;border-radius:10px;padding:10px 12px;margin-top:16px}.back{display:block;margin-top:18px;text-align:center;font-size:12px}</style></head><body><main class="login"><a class="logo" href="../index.html">NOVA<span>.</span></a><span class="eyebrow">FIRST ADMIN SETUP</span><h1>Buat ID Admin</h1><form id="setup-form"><label>ID Admin<input id="username" type="text" required minlength="3" placeholder="admin"></label><label>Password<input id="password" type="password" required minlength="6" placeholder="Minimal 6 karakter"></label><button>Buat Admin</button><div id="msg" class="msg"></div></form><div class="warn"><b>Penting:</b> halaman ini hanya untuk membuat admin pertama. Setelah berhasil, hapus atau jangan publikasikan file <code>admin-setup.html</code>.</div><a class="back" href="admin-login.html">← Ke halaman login</a></main><script type="module" src="../js/admin-setup.js"></script></body></html>
